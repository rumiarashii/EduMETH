<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

     <div class="games-header">
        <a class="header-prevbtn" href="index.html">PREV</a>
        <h1 class="header-title">EDUMETH</h1>
     </div>

     <div class="content-container">
        
        <main class="quiz-container">
           <section class="intro">
            <h2>Petunjuk</h2>
            <p>Pilih jawaban yang paling sesuai dengan kebiasaan belajarmu.</p>
        </section>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        </main>
        <div class="question">
            <div id="question"></div>
            <div id="options" class="options-container">

            </div>
        </div>

        <div class="navigation-container">
            <button id="prevBtn" class="button-navigation">Previous</button>
            <button id="nextBtn" class="button-navigation">Next</button>
        </div>

        <div class="finish-container">
            
            <button id="finishBtn" class="button-finish"><a href="index.html"></a>Finish</button>
        </div>
     </div>

     

     <script src="data.js"></script>
    
</body>
</html>
